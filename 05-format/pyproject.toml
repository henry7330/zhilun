[project]
name = "copilot-format"
version = "0.2.0"
description = "E 阶段 · 格式规整：按格式要求规整文件 → 文本一致性 → 导出"
requires-python = ">=3.11"
readme = "README.md"

# 核心依赖：只有这三个是任何模块都需要的
dependencies = [
    "pydantic>=2",
    "orjson>=3",
    "python-dotenv>=1",
]

[project.optional-dependencies]
# 依赖按用途分阶段安装，避免一次拉几个 GB（详见 ARCHITECTURE.md）
dev = ["pytest>=8"]
graph = ["langgraph>=1.2", "langgraph-checkpoint-sqlite>=3"]
retrieval = ["rank-bm25>=0.2", "model2vec>=0.10"]
stats = ["scipy>=1.11"]
retrieval-heavy = ["sentence-transformers>=3"]
mcp = ["mcp>=1.0"]
server = ["fastapi>=0.115", "uvicorn>=0.32"]
utils = ["requests>=2"]
# 报告解析：PDF 版查重/AI 报告需要（HTML/JSON 不需要，用标准库即可）
reports-pdf = ["pypdf>=5"]
# 改写的模型接入（任意 OpenAI 兼容端点）。
# 用 httpx 而不是 openai SDK —— 本系统只用一个接口，
# 而 httpx 已经因为 LangGraph 装上了，不新增依赖。
llm = ["httpx>=0.27"]

# ── 说明：为什么没有 [build-system] ──
# 本项目源码**按节点模块分散在多个 src 根目录**（见 00-core/src/copilot/__init__.py），
# 且仓库路径含中文。实测 `pip install -e .` 在中文路径下会**静默失效**
# （返回 0 但 import 失败，根因见 ARCHITECTURE.md 的「中文路径问题」一节）。
# 因此本项目**不走 pip 安装**，改用 scripts/install_dev_path.py 写 .pth。
# 没有 build-system 段是有意的，不是遗漏。

[tool.pytest.ini_options]
# 源码统一在仓库根的 src/ 下（单一布局），本文件只负责测试配置。
#
# 本阶段的节点实现位于：
#   src/copilot/format_stage/     阶段入口（E1/E2/E3 的编排）
#   src/copilot/quality/format/   E1 的 14 条格式规则
#   src/copilot/delivery/prcheck/ E1 的内容卫生检查
#   src/copilot/quality/review/   E2 文本一致性
#   src/copilot/delivery/export/  E3 导出 + 回读校验
#
# ⚠️ 新增节点时**必须同步 testpaths**，否则它的测试会被静默跳过。
pythonpath = ["../../src"]
testpaths = [
    "tests",
    "e1-format/tests",
    "e1-hygiene/tests",
    "e2-consistency/tests",
    "e3-export/tests",
]
addopts = "-q"
